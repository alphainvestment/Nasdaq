name: Informe diario Nasdaq Key Levels

on:
  schedule:
    # 21:30 UTC = 18:30 ART (Argentina, UTC-3). Lunes a viernes.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write           # commitear el HTML y crear el Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      GH_USER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar informe
        run: python generate_report.py

      - name: Publicar HTML (commit a la rama)
        run: |
          DATE=$(TZ=America/Argentina/Buenos_Aires date +%F)
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add informes/ index.html
          git commit -m "Informe Nasdaq key levels $DATE" || echo "sin cambios"
          git push

      - name: Crear Release (dispara el mail)
        run: |
          DATE=$(TZ=America/Argentina/Buenos_Aires date +%F)
          TITLE=$(head -1 RELEASE_NOTES.md | sed 's/^# //')
          gh release create "nasdaq-$DATE" \
            --title "$TITLE" \
            --notes-file RELEASE_NOTES.md \
            || gh release edit "nasdaq-$DATE" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
